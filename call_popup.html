<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📞 수신 전화</title>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    width: 100%; height: 100%;
    font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    background: transparent;
    -webkit-tap-highlight-color: transparent;
}
body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px;
    background: rgba(0,0,0,.35);
    transition: background .25s ease;
}
body.closed {
    background: #f5f5f5;
}

@keyframes alarmPop {
    0%   { transform: translateY(-30px) scale(.85); opacity: 0; }
    60%  { transform: translateY(5px)   scale(1.04); opacity: 1; }
    100% { transform: translateY(0)     scale(1);    opacity: 1; }
}
@keyframes alarmShake {
    0%,100% { transform: rotate(0deg); }
    25%     { transform: rotate(-12deg); }
    75%     { transform: rotate(12deg); }
}
@keyframes spin {
    to { transform: rotate(360deg); }
}

#popup {
    width: min(360px, 92vw);
    border-radius: 18px;
    box-shadow: 0 12px 44px rgba(0,0,0,.5);
    overflow: hidden;
    animation: alarmPop .4s cubic-bezier(.175,.885,.32,1.275);
    background: white;
}

/* 로딩 화면 */
.loading-box {
    background: linear-gradient(135deg,#1a73e8,#0d47a1);
    color: white;
    padding: 30px 20px;
    text-align: center;
}
.loading-box .spinner {
    width: 36px; height: 36px;
    border: 4px solid rgba(255,255,255,.3);
    border-top-color: white;
    border-radius: 50%;
    margin: 0 auto 12px;
    animation: spin .8s linear infinite;
}
.loading-box .phone-num {
    font-size: 18px; font-weight: 800; letter-spacing: .5px;
    margin-top: 8px;
}

/* 에러 화면 */
.error-box {
    background: #fff3e0;
    border: 1.5px solid #ffb74d;
    padding: 20px;
    text-align: center;
    color: #e65100;
}
.error-box .icon { font-size: 36px; margin-bottom: 8px; }
.error-box .msg  { font-size: 13px; line-height: 1.5; color: #6d4c00; }
.error-box .btn {
    display: inline-block;
    margin-top: 12px; padding: 10px 18px;
    background: #e65100; color: white;
    border: none; border-radius: 10px;
    font-size: 13px; font-weight: bold;
    cursor: pointer; text-decoration: none;
}
</style>
</head>
<body>

<div id="popup">
    <div class="loading-box">
        <div class="spinner"></div>
        <div style="font-size:13px; opacity:.85;">📱 수신 전화 정보 조회 중...</div>
        <div class="phone-num" id="loading-phone">-</div>
    </div>
</div>

<script>
/* ═══════════════════════════════════════════
   📞 별도 팝업 페이지 (Tasker 연동 전용)
   - URL 예: call_popup.html?incoming_call=01012345678
   - 기존 CRM과 동일한 Firebase DB에서 고객 정보 조회
═══════════════════════════════════════════ */

// ───── 설정 ─────
const FIREBASE_DATA_PATH = 'tech_crm/appData';
const CUSTOMER_FB_KEY    = 'crm_customer_firebase_v1';

// 메인 CRM 페이지 URL (상세 보기 클릭 시 이동)
// → 같은 폴더에 있는 index.html을 가리킴. 필요 시 절대경로로 변경하세요.
const MAIN_CRM_URL = 'index.html';

/* ══ 공통: 팝업 닫기 함수 ══
   우선순위:
   1) window.close() 시도 (JS로 열린 창은 성공)
   2) about:blank로 이동 (빈 화면 표시 — 가장 확실)
   - history.back()을 쓰면 이전 페이지(CRM)가 뜨므로 구현 X */
let _closeAttempted = false;
function closePopup() {
    if (_closeAttempted) return;
    _closeAttempted = true;

    // 1) 먼저 화면을 비움 (CRM 흔적 제거)
    document.body.classList.add('closed');
    document.getElementById('popup').innerHTML = `
        <div style="text-align:center;padding:30px 20px;color:#999;">
            <div style="font-size:32px;margin-bottom:10px;opacity:.5;">✔️</div>
            <div style="font-size:13px;">팝업이 닫혔습니다</div>
        </div>`;

    // 2) window.close() 시도 → 실패하면 about:blank로 이동
    try { window.close(); } catch(e) {}
    setTimeout(() => {
        // 아직 닫히지 않았으면 about:blank로 강제 이동
        window.location.replace('about:blank');
    }, 200);
}

// 알람 소리 (메인 CRM과 동일한 톤)
function playAlarmSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [880, 660].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, ctx.currentTime + i * .25);
            gain.gain.linearRampToValueAtTime(.3, ctx.currentTime + i * .25 + .05);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * .25 + .2);
            osc.connect(gain).connect(ctx.destination);
            osc.start(ctx.currentTime + i * .25);
            osc.stop(ctx.currentTime + i * .25 + .25);
        });
    } catch(e) { console.warn('알람 사운드 재생 실패:', e); }
}

// HTML 이스케이프
function escapeHtml(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// 전역 변수
let incomingNum = '';

// ───── 시작 ─────
(async function main() {
    const params = new URLSearchParams(window.location.search);
    incomingNum = params.get('incoming_call') || params.get('phone') || '';

    if (!incomingNum) {
        showError('전화번호 파라미터가 없습니다.<br>(?incoming_call=01012345678)');
        return;
    }

    document.getElementById('loading-phone').textContent = incomingNum;

    // Firebase 설정 로드
    const fbConfig = loadFirebaseConfig();
    if (!fbConfig) {
        showError(
            'Firebase 설정을 찾을 수 없습니다.<br>' +
            '먼저 메인 CRM에 한 번 접속해서<br>' +
            'Firebase를 연결해 주세요.',
            true
        );
        return;
    }

    // Firebase 초기화 & 데이터 조회
    try {
        firebase.initializeApp(fbConfig);
        const db = firebase.database();
        const snap = await db.ref(FIREBASE_DATA_PATH + '/customers').get();
        const customers = extractArrayLike(snap.val());

        const matched = findCustomerByPhone(customers, incomingNum);
        renderPopup(incomingNum, matched);
        playAlarmSound();

        // 60초 후 자동 닫기
        setTimeout(() => closePopup(), 60000);

    } catch (err) {
        console.error(err);
        showError('Firebase 조회 실패:<br>' + escapeHtml(err.message || String(err)), true);
    }
})();

// ───── Firebase 설정 로드 ─────
function loadFirebaseConfig() {
    try {
        const raw = localStorage.getItem(CUSTOMER_FB_KEY);
        if (!raw) return null;
        const cfg = JSON.parse(raw);
        if (!cfg.databaseURL || !cfg.apiKey) return null;
        return cfg;
    } catch (e) { return null; }
}

// ───── 배열/객체 모두 지원 ─────
function extractArrayLike(v) {
    if (!v) return [];
    if (Array.isArray(v)) return v.filter(Boolean);
    if (typeof v === 'object') return Object.values(v).filter(Boolean);
    return [];
}

// ───── 전화번호 매칭 ─────
function findCustomerByPhone(customers, phoneNum) {
    const digits = String(phoneNum || '').replace(/[^0-9]/g, '');
    if (!digits) return null;

    return customers.find(c => {
        const cDigits = String(c.phone || '').replace(/[^0-9]/g, '');
        if (!cDigits) return false;
        if (cDigits === digits) return true;
        if (digits.length >= 8 && cDigits.length >= 8) {
            return cDigits.slice(-8) === digits.slice(-8);
        }
        return false;
    }) || null;
}

// ───── 에러 화면 ─────
function showError(msg, showRetry) {
    document.getElementById('popup').innerHTML = `
        <div class="error-box">
            <div class="icon">⚠️</div>
            <div style="font-size:15px; font-weight:bold; margin-bottom:8px; color:#e65100;">
                팝업을 표시할 수 없습니다
            </div>
            <div class="msg">${msg}</div>
            ${showRetry ? `
                <a href="${MAIN_CRM_URL}" class="btn">🏠 메인 CRM 열기</a>
            ` : ''}
            <button onclick="closePopup()" class="btn"
                style="background:#999; margin-left:6px;">닫기</button>
        </div>`;
}

// ───── 팝업 본문 렌더 ─────
function renderPopup(phoneNum, customer) {
    const popup = document.getElementById('popup');

    if (customer) {
        // ── 등록된 고객 ──
        const services = extractArrayLike(customer.services);
        const unpaid = services
            .filter(s => s && s.isUnpaid === true)
            .reduce((sum, s) => sum + (Number(s.price) || 0), 0);

        const lastService = [...services]
            .filter(s => s && s.date)
            .sort((a, b) => String(b.date).localeCompare(String(a.date)))[0];

        const serviceCount = services.length;

        popup.innerHTML = `
        <div style="background:linear-gradient(135deg,#1a73e8,#0d47a1);
                    color:white;padding:15px 18px;
                    display:flex;align-items:center;gap:12px;">
            <div style="font-size:32px;animation:alarmShake .6s ease 2;">📞</div>
            <div style="flex:1;min-width:0;">
                <div style="font-size:11px;opacity:.85;margin-bottom:2px;">📱 수신 전화</div>
                <div style="font-size:15px;font-weight:800;letter-spacing:.5px;">
                    ${escapeHtml(phoneNum)}
                </div>
            </div>
            <button onclick="closePopup()"
                style="background:rgba(255,255,255,.2);color:white;
                       border:none;border-radius:8px;
                       padding:5px 10px;cursor:pointer;
                       font-weight:bold;font-size:14px;">✕</button>
        </div>

        <div style="background:white;padding:16px 18px;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
                <span style="background:#e8f5e9;color:#2e7d32;font-size:11px;font-weight:bold;
                             padding:3px 10px;border-radius:999px;border:1px solid #a5d6a7;">
                    ✅ 등록 고객${customer.no ? ' · No.' + escapeHtml(customer.no) : ''}
                </span>
                <span style="background:#e3f2fd;color:#1565c0;font-size:11px;font-weight:bold;
                             padding:3px 10px;border-radius:999px;border:1px solid #90caf9;">
                    총 ${serviceCount}회 방문
                </span>
            </div>

            <div style="font-size:24px;font-weight:900;color:#111;margin-bottom:6px;">
                ${escapeHtml(customer.name)}
            </div>

            ${customer.addr ? `
            <div style="font-size:12px;color:#666;margin-bottom:4px;">
                📍 ${escapeHtml(customer.addr)}
            </div>` : ''}

            ${customer.specs ? `
            <div style="font-size:12px;color:#666;margin-bottom:8px;">
                🔧 ${escapeHtml(customer.specs)}
            </div>` : ''}

            ${lastService ? `
            <div style="background:#f8f9fa;border-left:4px solid #1a73e8;
                        border-radius:0 8px 8px 0;padding:8px 12px;margin-bottom:10px;">
                <div style="font-size:11px;color:#888;margin-bottom:2px;">마지막 방문</div>
                <div style="font-size:13px;font-weight:bold;color:#333;">
                    📅 ${escapeHtml(lastService.date)}
                </div>
                <div style="font-size:12px;color:#555;margin-top:2px;">
                    ${escapeHtml(String(lastService.content || '').split('\n')[0].slice(0, 30))}
                </div>
            </div>` : ''}

            ${unpaid > 0 ? `
            <div style="background:#ffebee;border:1.5px solid #ffcdd2;border-radius:10px;
                        padding:10px 14px;margin-bottom:12px;
                        display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:13px;color:#c62828;font-weight:bold;">💳 미수금</span>
                <span style="font-size:18px;font-weight:900;color:#c62828;">
                    ${unpaid.toLocaleString()}원
                </span>
            </div>` : `
            <div style="background:#e8f5e9;border:1.5px solid #a5d6a7;border-radius:10px;
                        padding:8px 14px;margin-bottom:12px;text-align:center;">
                <span style="font-size:12px;color:#2e7d32;font-weight:bold;">✅ 미수금 없음</span>
            </div>`}

            <div style="display:flex;gap:8px;">
                <button onclick="openDetail('${escapeHtml(customer.id || '')}')"
                    style="flex:2;padding:13px;
                           background:linear-gradient(135deg,#1a73e8,#0d47a1);
                           color:white;border:none;border-radius:12px;
                           font-size:14px;font-weight:bold;cursor:pointer;">
                    📋 상세 보기
                </button>
                <button onclick="closePopup()"
                    style="flex:1;padding:13px;background:#f5f5f5;
                           color:#555;border:1px solid #ddd;
                           border-radius:12px;font-size:13px;
                           font-weight:bold;cursor:pointer;">닫기</button>
            </div>
        </div>`;

    } else {
        // ── 미등록 번호 ──
        popup.innerHTML = `
        <div style="background:linear-gradient(135deg,#f57c00,#e65100);
                    color:white;padding:15px 18px;
                    display:flex;align-items:center;gap:12px;">
            <div style="font-size:32px;animation:alarmShake .6s ease 2;">📞</div>
            <div style="flex:1;min-width:0;">
                <div style="font-size:11px;opacity:.85;margin-bottom:2px;">📱 수신 전화</div>
                <div style="font-size:15px;font-weight:800;letter-spacing:.5px;">
                    ${escapeHtml(phoneNum)}
                </div>
            </div>
            <button onclick="closePopup()"
                style="background:rgba(255,255,255,.2);color:white;
                       border:none;border-radius:8px;
                       padding:5px 10px;cursor:pointer;
                       font-weight:bold;font-size:14px;">✕</button>
        </div>

        <div style="background:white;padding:16px 18px;">
            <div style="text-align:center;margin-bottom:14px;">
                <div style="font-size:42px;margin-bottom:8px;">❓</div>
                <div style="font-size:16px;font-weight:800;color:#e65100;">미등록 번호</div>
                <div style="font-size:13px;color:#888;margin-top:4px;">
                    저장된 고객 정보가 없습니다
                </div>
            </div>

            <div style="background:#fff8f0;border:1.5px solid #ffcc80;border-radius:10px;
                        padding:10px 14px;margin-bottom:14px;text-align:center;">
                <div style="font-size:13px;color:#888;margin-bottom:2px;">수신 번호</div>
                <div style="font-size:20px;font-weight:900;color:#e65100;">
                    ${escapeHtml(phoneNum)}
                </div>
            </div>

            <button onclick="openRegister()"
                style="width:100%;padding:14px;
                       background:linear-gradient(135deg,#e65100,#bf360c);
                       color:white;border:none;border-radius:12px;
                       font-size:15px;font-weight:bold;
                       cursor:pointer;margin-bottom:8px;">
                ➕ 신규 고객으로 등록하기
            </button>

            <button onclick="closePopup()"
                style="width:100%;padding:11px;background:#f5f5f5;
                       color:#555;border:1px solid #ddd;
                       border-radius:12px;font-size:13px;
                       font-weight:bold;cursor:pointer;">닫기</button>
        </div>`;
    }
}

// ───── 상세 보기: 메인 CRM 열기 ─────
function openDetail(customerId) {
    const url = MAIN_CRM_URL +
        '?show_detail=' + encodeURIComponent(customerId);
    // 현재 탭에서 CRM을 열기 (새 탭 아닌 현재 탭 교체)
    window.location.href = url;
}

// ───── 고객 등록: 메인 CRM 열기 ─────
function openRegister() {
    const url = MAIN_CRM_URL +
        '?register_phone=' + encodeURIComponent(incomingNum);
    window.location.href = url;
}
</script>

</body>
