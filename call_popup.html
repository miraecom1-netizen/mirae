<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📞 수신 전화</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    width: 100%; height: 100%;
    font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
    background: rgba(0,0,0,.45);
}

@keyframes alarmPop {
    0%   { transform: translateY(-30px) scale(.85); opacity: 0; }
    60%  { transform: translateY(5px) scale(1.04); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
}
@keyframes alarmShake {
    0%,100% { transform: rotate(0deg); }
    25%     { transform: rotate(-12deg); }
    75%     { transform: rotate(12deg); }
}
@keyframes spin {
    to { transform: rotate(360deg); }
}

body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px;
}

#popup {
    width: min(360px, 92vw);
    border-radius: 18px;
    box-shadow: 0 12px 44px rgba(0,0,0,.5);
    overflow: hidden;
    animation: alarmPop .4s cubic-bezier(.175,.885,.32,1.275);
    background: white;
}

.loading-box {
    background: linear-gradient(135deg,#1a73e8,#0d47a1);
    color: white;
    padding: 30px 20px;
    text-align: center;
}
.spinner {
    width: 36px; height: 36px;
    border: 4px solid rgba(255,255,255,.3);
    border-top-color: white;
    border-radius: 50%;
    margin: 0 auto 12px;
    animation: spin .8s linear infinite;
}
</style>
</head>
<body>

<div id="popup">
    <div class="loading-box">
        <div class="spinner"></div>
        <div style="font-size:13px;opacity:.85;">📱 수신 전화 정보 조회 중...</div>
        <div id="loading-phone"
             style="font-size:18px;font-weight:800;
                    margin-top:8px;letter-spacing:.5px;">
            -
        </div>
    </div>
</div>

<script>
/* ═══════════════════════════════════════════
   📞 call_popup.html
   - Tasker 전화 수신 연동 전용 팝업
   - Firebase에서 고객 정보 직접 조회
   - 닫기 버튼: 창 완전히 비우기 (빈페이지 문제 해결)
═══════════════════════════════════════════ */

const FIREBASE_DATA_PATH = 'tech_crm/appData';
const CUSTOMER_FB_KEY    = 'crm_customer_firebase_v1';
const MAIN_CRM_URL       = 'https://miraecom1-netizen.github.io/mirae/index.html';

// ── HTML 이스케이프 ──
function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
}

// ── 배열/객체 모두 지원 ──
function toArray(v) {
    if (!v) return [];
    if (Array.isArray(v)) return v.filter(Boolean);
    if (typeof v === 'object') return Object.values(v).filter(Boolean);
    return [];
}

// ── 전화번호 매칭 ──
function findCustomer(customers, phone) {
    const d = phone.replace(/[^0-9]/g, '');
    if (!d) return null;
    return customers.find(c => {
        const cd = String(c.phone || '').replace(/[^0-9]/g, '');
        if (!cd) return false;
        if (cd === d) return true;
        if (d.length >= 8 && cd.length >= 8)
            return cd.slice(-8) === d.slice(-8);
        return false;
    }) || null;
}

// ── 알람 소리 ──
function playSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [[880,0],[660,.25],[880,.5]].forEach(([freq, t]) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'sine';
            o.frequency.value = freq;
            g.gain.setValueAtTime(0, ctx.currentTime + t);
            g.gain.linearRampToValueAtTime(.35, ctx.currentTime + t + .05);
            g.gain.linearRampToValueAtTime(0, ctx.currentTime + t + .22);
            o.connect(g).connect(ctx.destination);
            o.start(ctx.currentTime + t);
            o.stop(ctx.currentTime + t + .25);
        });
    } catch(e) {}
}

// ── 핵심: 닫기 함수 (빈 페이지 완전 해결) ──
function closePopup() {
    // 1) 팝업 내용 즉시 숨김
    const popup = document.getElementById('popup');
    if (popup) popup.style.display = 'none';

    // 2) 배경 완전 투명
    document.body.style.background = 'transparent';
    document.body.style.backgroundColor = 'transparent';
    document.documentElement.style.background = 'transparent';

    // 3) window.close() 시도
    try { window.close(); } catch(e) {}

    // 4) 500ms 후에도 안 닫혔으면
    //    히스토리 뒤로가기 시도
    setTimeout(() => {
        try {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.close();
            }
        } catch(e) {}
    }, 500);
}

// ── Firebase 설정 로드 ──
function loadFirebaseConfig() {
    try {
        const raw = localStorage.getItem(CUSTOMER_FB_KEY);
        if (!raw) return null;
        const cfg = JSON.parse(raw);
        if (!cfg.databaseURL || !cfg.apiKey) return null;
        return cfg;
    } catch(e) { return null; }
}

// ── 에러 화면 ──
function showError(msg) {
    document.getElementById('popup').innerHTML = `
    <div style="background:#fff3e0;padding:24px 20px;text-align:center;">
        <div style="font-size:36px;margin-bottom:10px;">⚠️</div>
        <div style="font-size:14px;font-weight:bold;
                    color:#e65100;margin-bottom:8px;">
            정보를 불러올 수 없습니다
        </div>
        <div style="font-size:12px;color:#6d4c00;
                    line-height:1.6;margin-bottom:16px;">
            ${msg}
        </div>
        <button onclick="closePopup()"
            style="width:100%;padding:13px;background:#e65100;
                   color:white;border:none;border-radius:12px;
                   font-size:14px;font-weight:bold;cursor:pointer;">
            닫기
        </button>
    </div>`;
}

// ── 등록 고객 팝업 ──
function renderKnownCustomer(phoneNum, customer) {
    const services    = toArray(customer.services);
    const unpaid      = services
        .filter(s => s && s.isUnpaid === true)
        .reduce((sum, s) => sum + (Number(s.price) || 0), 0);
    const lastService = [...services]
        .filter(s => s && s.date)
        .sort((a, b) => String(b.date).localeCompare(String(a.date)))[0];
    const count = services.length;

    document.getElementById('popup').innerHTML = `
    <!-- 헤더 -->
    <div style="background:linear-gradient(135deg,#1a73e8,#0d47a1);
                color:white;padding:15px 18px;
                display:flex;align-items:center;gap:12px;">
        <div style="font-size:30px;
                    animation:alarmShake .6s ease 2;">📞</div>
        <div style="flex:1;min-width:0;">
            <div style="font-size:11px;opacity:.8;margin-bottom:2px;">
                📱 수신 전화
            </div>
            <div style="font-size:15px;font-weight:800;">
                ${esc(phoneNum)}
            </div>
        </div>
        <button onclick="closePopup()"
            style="background:rgba(255,255,255,.2);color:white;
                   border:none;border-radius:8px;
                   padding:6px 12px;cursor:pointer;
                   font-weight:bold;font-size:15px;flex-shrink:0;">
            ✕
        </button>
    </div>

    <!-- 본문 -->
    <div style="background:white;padding:16px 18px;">

        <!-- 배지 -->
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
            <span style="background:#e8f5e9;color:#2e7d32;
                         font-size:11px;font-weight:bold;
                         padding:3px 10px;border-radius:999px;
                         border:1px solid #a5d6a7;">
                ✅ 등록 고객 · No.${esc(customer.no)}
            </span>
            <span style="background:#e3f2fd;color:#1565c0;
                         font-size:11px;font-weight:bold;
                         padding:3px 10px;border-radius:999px;
                         border:1px solid #90caf9;">
                총 ${count}회 방문
            </span>
        </div>

        <!-- 고객명 -->
        <div style="font-size:26px;font-weight:900;
                    color:#111;margin-bottom:8px;">
            ${esc(customer.name)}
        </div>

        <!-- 주소 -->
        ${customer.addr ? `
        <div style="font-size:12px;color:#666;margin-bottom:4px;">
            📍 ${esc(customer.addr)}
        </div>` : ''}

        <!-- 사양 -->
        ${customer.specs ? `
        <div style="font-size:12px;color:#666;margin-bottom:10px;">
            🔧 ${esc(customer.specs)}
        </div>` : ''}

        <!-- 마지막 방문 -->
        ${lastService ? `
        <div style="background:#f8f9fa;border-left:4px solid #1a73e8;
                    border-radius:0 8px 8px 0;
                    padding:8px 12px;margin-bottom:10px;">
            <div style="font-size:11px;color:#888;margin-bottom:2px;">
                마지막 방문
            </div>
            <div style="font-size:13px;font-weight:bold;color:#333;">
                📅 ${esc(lastService.date)}
            </div>
            <div style="font-size:12px;color:#555;margin-top:2px;">
                ${esc((lastService.content || '')
                    .split('\n')[0].slice(0,30))}
            </div>
        </div>` : ''}

        <!-- 미수금 -->
        ${unpaid > 0 ? `
        <div style="background:#ffebee;border:1.5px solid #ffcdd2;
                    border-radius:10px;padding:10px 14px;
                    margin-bottom:14px;
                    display:flex;justify-content:space-between;
                    align-items:center;">
            <span style="font-size:13px;color:#c62828;font-weight:bold;">
                💳 미수금
            </span>
            <span style="font-size:20px;font-weight:900;color:#c62828;">
                ${unpaid.toLocaleString()}원
            </span>
        </div>` : `
        <div style="background:#e8f5e9;border:1.5px solid #a5d6a7;
                    border-radius:10px;padding:9px 14px;
                    margin-bottom:14px;text-align:center;">
            <span style="font-size:12px;color:#2e7d32;font-weight:bold;">
                ✅ 미수금 없음
            </span>
        </div>`}

        <!-- 버튼 -->
        <div style="display:flex;gap:8px;">
            <a href="${MAIN_CRM_URL}"
                style="flex:2;padding:13px;
                       background:linear-gradient(135deg,#1a73e8,#0d47a1);
                       color:white;border:none;border-radius:12px;
                       font-size:14px;font-weight:bold;cursor:pointer;
                       text-decoration:none;text-align:center;
                       display:flex;align-items:center;
                       justify-content:center;">
                📋 CRM 열기
            </a>
            <button onclick="closePopup()"
                style="flex:1;padding:13px;background:#f5f5f5;
                       color:#555;border:1px solid #ddd;
                       border-radius:12px;font-size:13px;
                       font-weight:bold;cursor:pointer;">
                닫기
            </button>
        </div>
    </div>`;
}

// ── 미등록 번호 팝업 ──
function renderUnknownCustomer(phoneNum) {
    document.getElementById('popup').innerHTML = `
    <!-- 헤더 -->
    <div style="background:linear-gradient(135deg,#f57c00,#e65100);
                color:white;padding:15px 18px;
                display:flex;align-items:center;gap:12px;">
        <div style="font-size:30px;
                    animation:alarmShake .6s ease 2;">📞</div>
        <div style="flex:1;min-width:0;">
            <div style="font-size:11px;opacity:.8;margin-bottom:2px;">
                📱 수신 전화
            </div>
            <div style="font-size:15px;font-weight:800;">
                ${esc(phoneNum)}
            </div>
        </div>
        <button onclick="closePopup()"
            style="background:rgba(255,255,255,.2);color:white;
                   border:none;border-radius:8px;
                   padding:6px 12px;cursor:pointer;
                   font-weight:bold;font-size:15px;flex-shrink:0;">
            ✕
        </button>
    </div>

    <!-- 본문 -->
    <div style="background:white;padding:20px 18px;">
        <div style="text-align:center;margin-bottom:16px;">
            <div style="font-size:48px;margin-bottom:10px;">❓</div>
            <div style="font-size:17px;font-weight:800;color:#e65100;">
                미등록 번호
            </div>
            <div style="font-size:13px;color:#888;margin-top:4px;">
                저장된 고객 정보가 없습니다
            </div>
        </div>

        <div style="background:#fff8f0;border:1.5px solid #ffcc80;
                    border-radius:10px;padding:12px 14px;
                    margin-bottom:16px;text-align:center;">
            <div style="font-size:12px;color:#888;margin-bottom:4px;">
                수신 번호
            </div>
            <div style="font-size:22px;font-weight:900;color:#e65100;">
                ${esc(phoneNum)}
            </div>
        </div>

        <!-- 버튼 -->
        <a href="${MAIN_CRM_URL}?incoming_call=${encodeURIComponent(phoneNum)}"
            style="display:block;width:100%;padding:14px;
                   background:linear-gradient(135deg,#e65100,#bf360c);
                   color:white;border:none;border-radius:12px;
                   font-size:15px;font-weight:bold;cursor:pointer;
                   text-decoration:none;text-align:center;
                   margin-bottom:8px;">
            ➕ 신규 고객으로 등록하기
        </a>

        <button onclick="closePopup()"
            style="width:100%;padding:12px;background:#f5f5f5;
                   color:#555;border:1px solid #ddd;
                   border-radius:12px;font-size:13px;
                   font-weight:bold;cursor:pointer;">
            닫기
        </button>
    </div>`;
}

// ── 메인 실행 ──
(async function main() {
    const params = new URLSearchParams(window.location.search);
    const phoneNum = params.get('incoming_call') || params.get('phone') || '';

    if (!phoneNum) {
        showError('전화번호 파라미터가 없습니다.');
        return;
    }

    document.getElementById('loading-phone').textContent = phoneNum;

    const fbConfig = loadFirebaseConfig();
    if (!fbConfig) {
        showError(
            'Firebase 설정이 없습니다.<br>' +
            '메인 CRM에서 Firebase를 먼저 연결해 주세요.'
        );
        return;
    }

    try {
        // Firebase 중복 초기화 방지
        const app = firebase.apps.length
            ? firebase.apps[0]
            : firebase.initializeApp(fbConfig);

        const db   = firebase.database(app);
        const snap = await db.ref(FIREBASE_DATA_PATH + '/customers').get();
        const customers = toArray(snap.val());

        const matched = findCustomer(customers, phoneNum);

        if (matched) {
            renderKnownCustomer(phoneNum, matched);
        } else {
            renderUnknownCustomer(phoneNum);
        }

        playSound();

        // 60초 후 자동 닫기
        setTimeout(() => closePopup(), 60000);

    } catch(err) {
        console.error(err);
        showError('조회 실패: ' + esc(err.message || String(err)));
    }
})();
</script>
</body>
</html>
